<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پەنەلا کارمەندان | Worker Panel</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #333333;
            --dark-color: #121212;
            --light-color: #FFFFFF;
            --gray-color: #555555;
            --card-bg: #FFFFFF;
            --border-color: #f0f0f0;
        }

        body.dark-mode, body.red-mode {
            --primary-color: #FFFFFF;
            --dark-color: #FFFFFF;
            --light-color: #000000;
            --gray-color: #AAAAAA;
            --card-bg: #000000;
            --border-color: #222222;
            background-color: #000000 !important;
            color: #FFFFFF !important;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; outline: none; transition: background-color 0.3s, color 0.3s; }
        body { background-color: var(--light-color); color: var(--primary-color); line-height: 1.6; margin: 0; padding: 0; }

        #workerLoginScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999; color: #FFFFFF; padding: 20px;
        }
        .rolex-img-container { width: 180px; height: 180px; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; }
        .rolex-watch-img { max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 0 15px rgba(230, 126, 34, 0.4)); }
        .login-box {
            background: #121212; border: 2px solid #e67e22; padding: 25px; border-radius: 12px; width: 100%; max-width: 350px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center;
        }
        .login-box h3 { color: #e67e22; margin-bottom: 15px; font-size: 18px; }
        .form-group { margin-bottom: 12px; text-align: right; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; font-size: 12px; color: #ccc; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 8px; border: 1px solid #444; border-radius: 5px; background: #000; color: #fff; font-size: 13px; }
        .btn-login { background: #e67e22; color: #fff; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; font-size: 14px; margin-top: 10px; }

        .hero-section { background-color: #FFFFFF; width: 100%; }
        body.dark-mode .hero-section, body.red-mode .hero-section { background-color: #000000; }
        .hero {
            position: relative; width: 100%; height: 350px;
            background: url('https://i.ibb.co/G4Nv2cYy/photo-2026-10-23-23-06-04.jpg') no-repeat center center/cover;
            transition: background 0.3s ease;
        }
        body.dark-mode .hero { background: url('https://user47700.na.imgto.link/public/20261024/2f01137b93d40e2a72b7462b-photo-2026-10-24-22-21-34.avif') no-repeat center center/cover !important; }
        body.red-mode .hero { background: url('https://user47700.na.imgto.link/public/20261024/fe53bcfc4a8a106ccb41dd79-photo-2026-10-24-22-43-18.avif') no-repeat center center/cover !important; }

        .worker-logout-btn { position: absolute; top: 20px; left: 20px; background: #e74c3c; color: #fff; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 13px; z-index: 10; border: none; }
        .top-left-controls { position: absolute; top: 20px; left: 130px; display: flex; gap: 10px; z-index: 50; }
        .hero-theme-icon {
            background: rgba(255, 255, 255, 0.9); color: #121212; width: 40px; height: 40px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; cursor: pointer; font-size: 16px; border: 2px solid #121212;
        }
        body.dark-mode .hero-theme-icon, body.red-mode .hero-theme-icon { background: rgba(0, 0, 0, 0.9); color: #FFFFFF; border-color: #FFFFFF; }

        .theme-dropdown-menu {
            display: none; position: absolute; top: 50px; left: 0; background: #FFFFFF; border: 2px solid #121212;
            border-radius: 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); padding: 5px 0; min-width: 130px; z-index: 100; flex-direction: column;
        }
        body.dark-mode .theme-dropdown-menu, body.red-mode .theme-dropdown-menu { background: #000000; border-color: #FFFFFF; }
        .theme-option { display: flex; align-items: center; gap: 10px; padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: bold; color: var(--primary-color); }
        .theme-option:hover { background: rgba(0,0,0,0.08); }
        body.dark-mode .theme-option:hover, body.red-mode .theme-option:hover { background: rgba(255,255,255,0.15); }

        .hero-cart-icon {
            position: absolute; top: 20px; left: 180px; background: rgba(255, 255, 255, 0.9); color: #121212;
            width: 40px; height: 40px; border-radius: 50%; display: flex; justify-content: center; align-items: center;
            cursor: pointer; z-index: 10; font-size: 16px; border: 2px solid #121212;
        }
        body.dark-mode .hero-cart-icon, body.red-mode .hero-cart-icon { background: rgba(0, 0, 0, 0.9); color: #FFFFFF; border-color: #FFFFFF; }
        .hero-cart-badge { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 10px; font-weight: bold; }

        .container { max-width: 600px; margin: 30px auto; padding: 0 20px; }
        .category-filters { display: flex; justify-content: center; gap: 12px; margin-bottom: 35px; flex-wrap: wrap; }
        .filter-btn {
            background: #FFFFFF; border: 2px solid var(--dark-color); color: var(--primary-color);
            padding: 8px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 13px;
        }
        body.dark-mode .filter-btn, body.red-mode .filter-btn { background: #000000; border: 2px solid #FFFFFF; color: #FFFFFF; }
        .filter-btn:hover, .filter-btn.active { background: var(--dark-color); color: #FFFFFF; }
        body.dark-mode .filter-btn:hover, body.dark-mode .filter-btn.active,
        body.red-mode .filter-btn:hover, body.red-mode .filter-btn.active { background: #FFFFFF; color: #000000; }

        .products-grid { display: flex; flex-direction: column; gap: 40px; align-items: center; }
        .product-card {
            background: #FFFFFF; width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center;
            padding-bottom: 15px; border-bottom: 1px solid var(--border-color); position: relative;
        }
        body.dark-mode .product-card, body.red-mode .product-card { background: #000000; }
        .locked-badge { position: absolute; top: 15px; right: 15px; background: #e74c3c; color: #fff; padding: 5px 12px; font-size: 12px; font-weight: bold; border-radius: 4px; z-index: 5; }

        .image-slider-container { position: relative; width: 100%; height: 320px; overflow: hidden; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .product-img { width: 100%; height: 100%; object-fit: contain; display: none; }
        .product-img.active-img { display: block; }

        .card-center-info { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 100%; margin-top: 15px; text-align: center; }
        .card-product-code { font-size: 12px; color: #e67e22; font-weight: bold; }
        .card-product-title { font-size: 16px; font-weight: bold; }
        .card-bottom-row { display: flex; align-items: center; justify-content: center; gap: 20px; width: 100%; }
        .card-price-tag { font-size: 15px; font-weight: bold; }

        .card-plus-btn {
            background: #FFFFFF; color: #121212; width: 36px; height: 36px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: bold; cursor: pointer; border: 1px solid #121212;
        }
        body.dark-mode .card-plus-btn, body.red-mode .card-plus-btn { background: #000000; color: #FFFFFF; border: 1px solid #FFFFFF; }

        .btn {
            background: var(--dark-color); color: #FFFFFF; padding: 10px 20px; border: none; border-radius: 5px;
            font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 14px;
        }
        body.dark-mode .btn, body.red-mode .btn { background: #FFFFFF; color: #000000; }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background: #FFFFFF; color: var(--primary-color); padding: 20px 30px; width: 100%; max-width: 500px; position: relative; text-align: right; display: flex; flex-direction: column; max-height: 90vh; overflow-y: auto; margin: auto; }
        body.dark-mode .modal-content, body.red-mode .modal-content { background: #000000; }
        .close-btn {
            position: absolute; top: 20px; left: 25px; font-size: 28px; cursor: pointer; color: var(--primary-color);
            font-weight: bold; z-index: 1010; background: #FFFFFF; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #ddd;
        }
        body.dark-mode .close-btn, body.red-mode .close-btn { background: #000000; color: #FFFFFF; border-color: #444; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding: 10px 0; font-size: 14px; gap: 10px; }
        .cart-item-img { width: 45px; height: 45px; object-fit: contain; border-radius: 4px; background: #f9f9f9; }
        body.dark-mode .cart-item-img { background: #111; }
        .qty-controls { display: flex; align-items: center; gap: 6px; margin: 0 5px; }
        .qty-btn { background: #FFFFFF; border: 1px solid #ccc; width: 23px; height: 23px; font-weight: bold; cursor: pointer; border-radius: 3px; color: #121212; }
        body.dark-mode .qty-btn, body.red-mode .qty-btn { background: #000000; border-color: #444; color: #FFFFFF; }
        .cart-total { font-size: 15px; font-weight: bold; margin: 10px 0; text-align: left; color: var(--primary-color); }
    </style>
</head>
<body>

    <div id="workerLoginScreen">
        <div class="rolex-img-container">
            <img src="https://user47700.na.imgto.link/public/20261026/01b1b3eb61b7db8ab048f004-images-9-removebg-preview-1.avif" alt="Watch" class="rolex-watch-img">
        </div>
        <div class="login-box">
            <h3>چوونە ژوورا کارمەندان</h3>
            <form onsubmit="workerLogin(event)">
                <div class="form-group"><label>ID:</label><input type="text" id="workerId" required placeholder="ID بنڤیسە"></div>
                <div class="form-group"><label>Password:</label><input type="password" id="workerPass" required placeholder="ژمارا نهێنی بنڤیسە"></div>
                <button type="submit" class="btn-login">چوونە ژوورێ</button>
            </form>
        </div>
    </div>

    <div id="workerStoreView" style="display: none;">
        <div class="hero-section">
            <div class="hero">
                <button class="worker-logout-btn" onclick="workerLogout()"><i class="fa-solid fa-right-from-bracket"></i> چوونە دەر</button>
                <div class="top-left-controls">
                    <div class="hero-theme-icon" onclick="toggleThemeMenu(event)" title="گۆهۆڕینا مۆدان"><i class="fa-solid fa-palette" id="masterThemeIcon"></i></div>
                    <div class="theme-dropdown-menu" id="themeDropdownMenu">
                        <div class="theme-option" onclick="setTheme('light')"><i class="fa-solid fa-sun" style="color: #f39c12;"></i> <span>Light Mode</span></div>
                        <div class="theme-option" onclick="setTheme('dark')"><i class="fa-solid fa-moon" style="color: #ffffff;"></i> <span>Dark Mode</span></div>
                        <div class="theme-option" onclick="setTheme('red')"><i class="fa-solid fa-fire" style="color: #ff4d4d;"></i> <span>Red Mode</span></div>
                    </div>
                </div>
                <div class="hero-cart-icon" onclick="openCartModal()" title="سەلکا من">
                    <i class="fa-solid fa-cart-shopping"></i><span class="hero-cart-badge" id="cartCount">0</span>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="category-filters" id="filter-buttons">
                <button class="filter-btn active" onclick="filterProducts('all', this)">هەمی دەمژمێر</button>
            </div>
            <div class="products-grid" id="product-list">
                <p style="text-align: center; grid-column: 1/-1;">داتایێن دەمژمێران دهێنە بارکرن...</p>
            </div>
        </div>
    </div>

    <div class="modal" id="cartModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeCartModal()">&times;</span>
            <h2>سەلکا خڕکردنێ</h2>
            <div id="cartItemsList" style="margin-top: 10px;"></div>
            <div class="cart-total" id="cartTotalPrice" style="display: none;"></div>
            <button class="btn" id="showOrderOptionsBtn" onclick="showOrderOptions()" style="width: 100%; display: none; margin-top: 10px; background: #27ae60; color: #fff;">داخاز بکە</button>
            <div id="orderTypeSelection" style="display: none; margin-top: 15px;">
                <hr style="margin-bottom: 12px; border: 0; border-top: 1px solid var(--border-color);">
                <p style="font-weight: bold; margin-bottom: 10px; text-align: center;">جۆرێ داخازێ هەڵبژێرە:</p>
                <div style="display: flex; gap: 10px;">
                    <button class="btn" style="flex: 1; background: #27ae60; color: #fff;" onclick="selectOrderType('personal')">بۆ خۆ</button>
                    <button class="btn" style="flex: 1; background: #e67e22; color: #fff;" onclick="selectOrderType('commercial')">بۆ تجارەتی</button>
                </div>
            </div>
            <form id="personalForm" onsubmit="submitPersonalOrder(event)" style="display: none; margin-top: 15px;">
                <hr style="margin-bottom: 12px; border: 0; border-top: 1px solid var(--border-color);">
                <h3 style="font-size: 15px; margin-bottom: 10px; color: #27ae60;">داخازا بۆ خۆ (شەخسی)</h3>
                <div class="form-group"><label>نافێ تە:</label><input type="text" id="pName" required placeholder="ناڤێ تە یێ تەمام"></div>
                <div class="form-group"><label>ژمارا مۆبایلێ:</label><input type="tel" id="pPhone" required placeholder="0750XXXXXXX"></div>
                <div class="form-group">
                    <label>شار:</label>
                    <select id="pCity" onchange="renderCartItems()" required>
                        <option value="" disabled selected>شارەکێ هەڵبژێرە</option>
                        <option value="زاخۆ" data-fee="2000">زاخۆ (2,000 د.ع)</option>
                        <option value="دهۆک" data-fee="4000">دهۆک (4,000 د.ع)</option>
                        <option value="سێمێل" data-fee="3000">سێمێل (3,000 د.ع)</option>
                    </select>
                </div>
                <div class="form-group"><label>ناڤونیشان:</label><textarea id="pAddress" rows="2" required></textarea></div>
                <button type="submit" class="btn" style="width: 100%; background: #27ae60; color: #fff;">ناردنا داخازێ</button>
            </form>
            <form id="commercialForm" onsubmit="submitCommercialOrder(event)" style="display: none; margin-top: 15px;">
                <hr style="margin-bottom: 12px; border: 0; border-top: 1px solid var(--border-color);">
                <h3 style="font-size: 15px; margin-bottom: 10px; color: #e67e22;">داخازا تجارەتی</h3>
                <div class="form-group"><label>نافێ وەرگری:</label><input type="text" id="cReceiver" required></div>
                <div class="form-group"><label>مۆبایلا وەرگری:</label><input type="tel" id="cReceiverPhone" required></div>
                <div class="form-group">
                    <label>شار:</label>
                    <select id="cCity" onchange="renderCartItems()" required>
                        <option value="" disabled selected>شارەکێ هەڵبژێرە</option>
                        <option value="زاخۆ" data-fee="2000">زاخۆ (2,000 د.ع)</option>
                        <option value="دهۆک" data-fee="4000">دهۆک (4,000 د.ع)</option>
                        <option value="سێمێل" data-fee="3000">سێمێل (3,000 د.ع)</option>
                    </select>
                </div>
                <div class="form-group"><label>ناڤونیشانیت وەرگری:</label><textarea id="cReceiverAddress" rows="2" required></textarea></div>
                <div class="form-group"><label>بڕێ فایدەیی:</label><input type="text" id="cProfit" required placeholder="مثال: 25,000 د.ع"></div>
                <button type="submit" class="btn" style="width: 100%; background: #e67e22; color: #fff;">ناردنا تجارەتی</button>
            </form>
        </div>
    </div>

    <script>
        const workersSheetCSVUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ1wsQ5fcnEbCvqiQ2NejR9naNrozXXxgxYsqxnc3cnCYvrDbYnIeJl_jGqgi6WwnenKy0gLnHq35jm/pub?output=csv';
        const sheetCSVUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQUgGUp_uVa2N2S9b3HgLGtTEtBJN5LOb20GfRDO_NVhWq1M1pOVHiyH37rHcLPAGDysRRUmbJvyFw_/pub?output=csv';
        
        let allWorkers = [], loggedInWorkerName = "", allProducts = [], availableBrands = new Set(['all']), cart = [], currentFilterBrand = 'all';

        function toggleThemeMenu(event) {
            event.stopPropagation();
            const menu = document.getElementById('themeDropdownMenu');
            menu.style.display = (menu.style.display === 'flex') ? 'none' : 'flex';
        }
        window.addEventListener('click', () => { document.getElementById('themeDropdownMenu').style.display = 'none'; });

        function setTheme(mode) {
            document.body.classList.remove('dark-mode', 'red-mode');
            const masterIcon = document.getElementById('masterThemeIcon');
            if (mode === 'dark') { document.body.classList.add('dark-mode'); masterIcon.className = 'fa-solid fa-moon'; }
            else if (mode === 'red') { document.body.classList.add('red-mode'); masterIcon.className = 'fa-solid fa-fire'; }
            else { masterIcon.className = 'fa-solid fa-sun'; }
            document.getElementById('themeDropdownMenu').style.display = 'none';
        }

        async function fetchWorkersData() {
            try {
                const res = await fetch(workersSheetCSVUrl);
                const data = await res.text();
                const lines = data.split('\n');
                allWorkers = [];
                for (let i = 1; i < lines.length; i++) {
                    let line = lines[i].trim();
                    if(!line) continue;
                    let r = [], inQuotes = false, currentVal = '';
                    for (let char of line) {
                        if (char === '"') inQuotes = !inQuotes;
                        else if (char === ',' && !inQuotes) { r.push(currentVal.trim()); currentVal = ''; }
                        else currentVal += char;
                    }
                    r.push(currentVal.trim());
                    if (r.length >= 3) allWorkers.push({ name: r[0].replace(/^"|"$/g, ''), id: r[1].replace(/^"|"$/g, ''), pass: r[2].replace(/^"|"$/g, '') });
                }
            } catch(e){}
        }
        fetchWorkersData();

        function workerLogin(e) {
            e.preventDefault();
            let id = document.getElementById('workerId').value.trim();
            let pass = document.getElementById('workerPass').value.trim();
            let w = allWorkers.find(x => x.id === id && x.pass === pass);
            if (w) {
                loggedInWorkerName = w.name;
                document.getElementById('workerLoginScreen').style.display = 'none';
                document.getElementById('workerStoreView').style.display = 'block';
                fetchSheetData();
            } else { alert('ID یان Password خەلەتە!'); }
        }

        function workerLogout() { location.reload(); }

        async function fetchSheetData() {
            try {
                const res = await fetch(sheetCSVUrl);
                parseCSV(await res.text());
            } catch(e){}
        }

        function parseCSV(text) {
            const lines = text.split('\n');
            allProducts = [];

            for (let i = 1; i < lines.length; i++) {
                let line = lines[i].trim();
                if (!line) continue;
                let row = [], inQuotes = false, currentVal = '';
                for (let char of line) {
                    if (char === '"') inQuotes = !inQuotes;
                    else if (char === ',' && !inQuotes) { row.push(currentVal.trim()); currentVal = ''; }
                    else currentVal += char;
                }
                row.push(currentVal.trim());

                if (row.length >= 8) {
                    let pCode = row[0] ? row[0].replace(/^"|"$/g, '') : ''; // کۆد ژ ستوونا A
                    let pName = row[1] ? row[1].replace(/^"|"$/g, '') : ''; // ناڤ ژ ستوونا B
                    let pBrand = row[2] ? row[2].toLowerCase().replace(/^"|"$/g, '') : ''; // مارکە ژ ستوونا C
                    let originalPrice = row[3] ? row[3].replace(/^"|"$/g, '') : ''; // بها ژ ستوونا D
                    
                    let img1 = row[4] ? row[4].replace(/^"|"$/g, '') : '';
                    let img2 = row[5] ? row[5].replace(/^"|"$/g, '') : '';
                    let img3 = row[6] ? row[6].replace(/^"|"$/g, '') : '';
                    
                    let pDesc = row[7] ? row[7].replace(/^"|"$/g, '') : ''; // تێبینی ژ ستوونا H
                    let isLockedFromSheet = row[8] ? row[8].toLowerCase().replace(/^"|"$/g, '') === 'true' : false; // قفل ژ ستوونا I
                    let discountFromSheet = row[9] ? row[9].replace(/^"|"$/g, '') : ''; // داشکاندن ژ ستوونا J

                    allProducts.push({
                        id: i - 1,
                        code: pCode,
                        name: pName,
                        brand: pBrand,
                        price: originalPrice,
                        imgs: [img1, img2, img3].filter(x => x),
                        desc: pDesc,
                        isLocked: isLockedFromSheet,
                        discountVal: discountFromSheet
                    });
                    if(pBrand) availableBrands.add(pBrand);
                }
            }
            buildFilterButtons();
            filterProducts(currentFilterBrand, document.querySelector('.filter-btn'));
        }

        function buildFilterButtons() {
            const filterContainer = document.getElementById('filter-buttons');
            filterContainer.innerHTML = `<button class="filter-btn active" onclick="filterProducts('all', this)">هەمی دەمژمێر</button>`;
            availableBrands.forEach(brand => {
                if (brand !== 'all') {
                    let btn = document.createElement('button');
                    btn.className = 'filter-btn';
                    btn.setAttribute('onclick', `filterProducts('${brand}', this)`);
                    btn.innerText = brand.toUpperCase();
                    filterContainer.appendChild(btn);
                }
            });
        }

        function displayProducts(filteredProducts) {
            const grid = document.getElementById('product-list');
            grid.innerHTML = '';
            if(filteredProducts.length === 0) { grid.innerHTML = '<p style="text-align: center; color: #aaa;">چ دەمژمێر نینن.</p>'; return; }

            filteredProducts.forEach(product => {
                let finalPriceStr = product.price;
                let rawPriceNum = parseFloat(product.price.replace(/[^0-9.]/g, '')) || 0;
                let displayPriceHTML = `<div class="card-price-tag">${product.price}</div>`;

                if (product.discountVal) {
                    let calcNum = rawPriceNum;
                    if (product.discountVal.includes('%')) {
                        calcNum = rawPriceNum - (rawPriceNum * (parseFloat(product.discountVal) / 100));
                        finalPriceStr = calcNum.toLocaleString() + ' د.ع';
                    } else if (rawPriceNum > 0) {
                        calcNum = rawPriceNum - (parseFloat(product.discountVal) || 0);
                        finalPriceStr = calcNum.toLocaleString() + ' د.ع';
                    }
                    displayPriceHTML = `<div class="card-price-tag"><span style="text-decoration: line-through; color: #888; font-size: 13px; margin-left: 8px;">${product.price}</span><span style="color: #e74c3c;">${finalPriceStr}</span></div>`;
                }

                let plusBtnHTML = `<div class="card-plus-btn" onclick="addToCart(${product.id}, '${finalPriceStr}')"><i class="fa-solid fa-plus"></i></div>`;
                if (product.isLocked) plusBtnHTML = `<span style="font-size: 12px; color: #e74c3c; font-weight: bold;">بەردەست نینە</span>`;

                let imagesHTML = '';
                product.imgs.forEach((imgUrl, imgIdx) => { imagesHTML += `<img src="${imgUrl}" class="product-img ${imgIdx === 0 ? 'active-img' : ''}">`; });
                if(product.imgs.length === 0) imagesHTML = `<img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80" class="product-img active-img">`;

                grid.innerHTML += `
                    <div class="product-card">
                        ${product.isLocked ? '<div class="locked-badge">قفلكرییە</div>' : ''}
                        <div class="image-slider-container">${imagesHTML}</div>
                        <div class="card-center-info">
                            <div class="card-product-code">کۆد: ${product.code}</div>
                            <div class="card-product-title">${product.name}</div>
                            <div class="card-bottom-row">${displayPriceHTML}${plusBtnHTML}</div>
                        </div>
                    </div>
                `;
            });
        }

        function filterProducts(brand, btn) {
            currentFilterBrand = brand;
            if(btn) { document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
            displayProducts(brand === 'all' ? allProducts : allProducts.filter(p => p.brand === brand));
        }

        function addToCart(productId, finalPriceStr) {
            let product = allProducts.find(p => p.id === productId);
            if (!product || product.isLocked) return;
            let item = cart.find(x => x.id === productId);
            if (item) item.qty++;
            else cart.push({ id: product.id, code: product.code, name: product.name, price: finalPriceStr, img: product.imgs[0] || '', qty: 1 });
            document.getElementById('cartCount').innerText = cart.reduce((a,b)=>a+b.qty,0);
            alert(`(${product.name}) هاتە زێدەکرن!`);
        }

        function openCartModal() {
            renderCartItems();
            document.getElementById('orderTypeSelection').style.display = 'none';
            document.getElementById('personalForm').style.display = 'none';
            document.getElementById('commercialForm').style.display = 'none';
            document.getElementById('showOrderOptionsBtn').style.display = cart.length > 0 ? 'block' : 'none';
            document.getElementById('cartModal').style.display = 'flex';
        }
        function closeCartModal() { document.getElementById('cartModal').style.display = 'none'; }

        function renderCartItems() {
            let list = document.getElementById('cartItemsList');
            list.innerHTML = '';
            if (cart.length === 0) {
                list.innerHTML = '<p style="text-align: center; color: var(--gray-color);">سەلکا تە یا ڤalایە.</p>';
                document.getElementById('cartTotalPrice').style.display = 'none';
                return;
            }
            let subtotal = 0;
            cart.forEach((item, idx) => {
                let itemTotal = (parseFloat(item.price.replace(/[^0-9.]/g, '')) || 0) * item.qty;
                subtotal += itemTotal;
                list.innerHTML += `
                    <div class="cart-item">
                        <img src="${item.img}" class="cart-item-img">
                        <div style="flex:1;"><span style="font-size:11px; color:#e67e22; font-weight:bold;">کۆد: ${item.code}</span><br><b>${item.name}</b><br><span style="font-size:12px;">${item.price} × ${item.qty} = ${itemTotal.toLocaleString()} د.ع</span></div>
                        <div style="display:flex; align-items:center;">
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="changeQty(${idx}, -1)">-</button>
                                <span>${item.qty}</span>
                                <button class="qty-btn" onclick="changeQty(${idx}, 1)">+</button>
                            </div>
                            <i class="fa-solid fa-trash" style="color:red; cursor:pointer; margin-right:6px;" onclick="removeFromCart(${idx})"></i>
                        </div>
                    </div>
                `;
            });

            let deliveryFee = 0;
            let pCity = document.getElementById('pCity'), cCity = document.getElementById('cCity');
            if (document.getElementById('personalForm').style.display === 'block' && pCity?.selectedOptions[0]) deliveryFee = parseFloat(pCity.selectedOptions[0].dataset.fee) || 0;
            if (document.getElementById('commercialForm').style.display === 'block' && cCity?.selectedOptions[0]) deliveryFee = parseFloat(cCity.selectedOptions[0].dataset.fee) || 0;

            let grandTotal = subtotal + deliveryFee;
            let totalDiv = document.getElementById('cartTotalPrice');
            totalDiv.style.display = 'block';
            totalDiv.innerHTML = `بهایێ بەرهەمان: ${subtotal.toLocaleString()} د.ع<br>گەهاندن: ${deliveryFee.toLocaleString()} د.ع<br><span style="color:#27ae60;">کۆی گشتی: ${grandTotal.toLocaleString()} دينار</span>`;
        }

        function changeQty(i, change) {
            cart[i].qty += change;
            if (cart[i].qty <= 0) cart.splice(i, 1);
            document.getElementById('cartCount').innerText = cart.reduce((a,b)=>a+b.qty,0);
            renderCartItems();
            if(cart.length === 0) document.getElementById('showOrderOptionsBtn').style.display = 'none';
        }
        function removeFromCart(i) {
            cart.splice(i, 1);
            document.getElementById('cartCount').innerText = cart.reduce((a,b)=>a+b.qty,0);
            renderCartItems();
            if(cart.length === 0) document.getElementById('showOrderOptionsBtn').style.display = 'none';
        }

        function showOrderOptions() {
            document.getElementById('showOrderOptionsBtn').style.display = 'none';
            document.getElementById('orderTypeSelection').style.display = 'block';
        }
        function selectOrderType(type) {
            document.getElementById('orderTypeSelection').style.display = 'none';
            document.getElementById('personalForm').style.display = type === 'personal' ? 'block' : 'none';
            document.getElementById('commercialForm').style.display = type === 'commercial' ? 'block' : 'none';
            renderCartItems();
        }

        function submitPersonalOrder(e) {
            e.preventDefault();
            alert(`داخازا شەخسی یا کارمەند (${loggedInWorkerName}) ب سەرکەفتی هاتە ناردن!`);
            cart = []; document.getElementById('cartCount').innerText = 0; closeCartModal(); document.getElementById('personalForm').reset();
        }
        function submitCommercialOrder(e) {
            e.preventDefault();
            alert(`داخازا تجارەتی یا کارمەند (${loggedInWorkerName}) ب سەرکەفتی هاتە ناردن!`);
            cart = []; document.getElementById('cartCount').innerText = 0; closeCartModal(); document.getElementById('commercialForm').reset();
        }
    </script>
</body>
</html>
